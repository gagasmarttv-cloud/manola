name: Build Maps Review Agent APK

on:
  push:
    branches:
      - maps-review-agent-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct Android project
        run: |
          set -euo pipefail
          cat apkbuild/chunks/part*.txt > /tmp/maps_review_agent.b64
          base64 -d /tmp/maps_review_agent.b64 > /tmp/maps_review_agent.zip
          unzip -t /tmp/maps_review_agent.zip
          rm -rf /tmp/maps_review_agent
          mkdir -p /tmp/maps_review_agent
          unzip -q /tmp/maps_review_agent.zip -d /tmp/maps_review_agent
          test -f /tmp/maps_review_agent/maps_review_agent_motorola/app/build.gradle

      - name: Build debug APK
        working-directory: /tmp/maps_review_agent/maps_review_agent_motorola
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=/tmp/maps_review_agent/maps_review_agent_motorola/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex|resources.arsc'
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MapsReviewAgent-Motorola
          path: /tmp/maps_review_agent/maps_review_agent_motorola/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
