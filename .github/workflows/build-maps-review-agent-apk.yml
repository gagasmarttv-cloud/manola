name: Build Maps Review Agent APK

on:
  push:
    branches:
      - maps-review-agent-apk-build
    paths-ignore:
      - 'apkbuild/output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: maps-review-agent-apk-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct Android project
        run: |
          set -euo pipefail
          cat apkbuild/chunks/part*.txt > /tmp/maps_review_agent.b64
          base64 -d /tmp/maps_review_agent.b64 > /tmp/maps_review_agent.zip
          unzip -t /tmp/maps_review_agent.zip
          rm -rf /tmp/maps_review_agent
          mkdir -p /tmp/maps_review_agent
          unzip -q /tmp/maps_review_agent.zip -d /tmp/maps_review_agent
          test -f /tmp/maps_review_agent/maps_review_agent_motorola/app/build.gradle

      - name: Build and prepare output chunks
        id: build
        shell: bash
        run: |
          set +e
          PROJECT=/tmp/maps_review_agent/maps_review_agent_motorola
          OUTPUT="$GITHUB_WORKSPACE/apkbuild/output"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/chunks"

          cd "$PROJECT"
          gradle --no-daemon --stacktrace assembleDebug > "$OUTPUT/build.log" 2>&1
          RC=$?

          if [ "$RC" -eq 0 ] && [ -s "$APK" ]; then
            unzip -t "$APK" >> "$OUTPUT/build.log" 2>&1
            VERIFY_RC=$?
            if [ "$VERIFY_RC" -eq 0 ]; then
              cp "$APK" "$OUTPUT/MapsReviewAgent-Motorola.apk"
              sha256sum "$APK" | tee "$OUTPUT/sha256.txt"
              python3 - <<'PY'
from pathlib import Path
import base64
apk = Path('apkbuild/output/MapsReviewAgent-Motorola.apk')
out = Path('apkbuild/output/chunks')
s = base64.b64encode(apk.read_bytes()).decode('ascii')
for i in range(0, len(s), 3000):
    (out / f'part{i//3000:04d}.txt').write_text(s[i:i+3000], encoding='ascii')
Path('apkbuild/output/status.txt').write_text('SUCCESS\n', encoding='utf-8')
Path('apkbuild/output/size.txt').write_text(str(apk.stat().st_size) + '\n', encoding='utf-8')
PY
              rm -f "$OUTPUT/MapsReviewAgent-Motorola.apk"
            else
              echo "VERIFY_FAILED" > "$OUTPUT/status.txt"
              RC=$VERIFY_RC
            fi
          else
            echo "BUILD_FAILED" > "$OUTPUT/status.txt"
          fi

          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit build output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apkbuild/output
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Store Maps Review Agent APK build output"
            git push origin HEAD:maps-review-agent-apk-build
          fi

      - name: Fail workflow when build failed
        if: steps.build.outputs.rc != '0'
        run: exit 1
